name: Syntax checks

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile TPFuse files
        run: |
          python -m py_compile models/TPFuse.py
          python -m py_compile exp/exp_long_term_forecasting_tpfuse.py
          python -m py_compile run_tpfuse.py

      - name: Validate Traffic shell script
        run: |
          bash -n scripts/TPFuse/traffic.sh
